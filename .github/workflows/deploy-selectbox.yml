name: Deploy selectbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.prod.yml"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-selectbox.yml"

concurrency:
  group: deploy-selectbox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 35m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/1panel/docker/compose/selectbox
            cp -a .env /tmp/selectbox.env.bak
            cp -a .env.production /tmp/selectbox.env.production.bak 2>/dev/null || true
            git fetch origin
            git reset --hard origin/main
            cp -a /tmp/selectbox.env.bak .env
            if [ -f /tmp/selectbox.env.production.bak ]; then
              cp -a /tmp/selectbox.env.production.bak .env.production
            else
              cp -a .env .env.production
            fi
            echo "=== HEAD ==="
            git log -1 --oneline
            docker compose -f docker-compose.prod.yml --env-file .env.production build api web
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps --force-recreate api web
            sleep 10
            # OpenResty گاهی IP قدیمی کانتینر را نگه می‌دارد
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate nginx 2>/dev/null || true
            sleep 3
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            curl -sS -o /dev/null -w "local8092 %{http_code}\n" --max-time 25 -H 'Host: dashtestan-store.ir' http://127.0.0.1:8092/
            curl -sS -o /dev/null -w "pb-home %{http_code}\n" --max-time 25 -H 'Host: dashtestan-store.ir' http://127.0.0.1:8092/api/v1/catalog/page-builder/home || true
            echo DEPLOY_OK
